name: Probe Playtomic (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://playtomic.io/v1/tenants?sport_id=PICKLEBALL&coordinate=1.3521,103.8198&radius=30000&size=5" "https://playtomic.io/" "https://playtomic.com/" "https://playtomic.com/clubs/b2k-x-shotzone" "https://playtomic.com/api/v1/tenants?sport_id=PADEL&coordinate=1.3521,103.8198&radius=30000&size=5"; do
            echo "== $u"; curl -s -m 20 -o /dev/null -D - -A 'pickleball-tracker (personal use; github.com/kklmwd/pickleball-tracker)' "$u" | grep -iE '^(HTTP|location|server|x-cache|cf-ray|x-amz-cf)' || echo ERR
          done
